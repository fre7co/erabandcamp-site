# nginx усередині контейнера сайту (порт 80, без SSL).
# SSL і маршрутизацію /quiz/ робить зовнішній reverse proxy — див. README.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;   # редіректи без http://...:80, коректно за HTTPS-проксі

    # справжня IP клієнта, якщо перед нами проксі
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # стиснення
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/ld+json image/svg+xml;

    # безпека (повторюємо в кожному location, бо add_header не успадковується)
    include /etc/nginx/snippets/headers.conf;

    # старий WordPress-URL політики → новий
    location = /privacy-policy  { return 301 /privacy/; }
    location = /privacy-policy/ { return 301 /privacy/; }

    # квіз — окремий застосунок. Якщо запит дійшов сюди, значить зовнішній проксі
    # налаштований неправильно. Віддаємо 502, а не головну, щоб помилку було видно.
    location ^~ /quiz/ {
        return 502 "Quiz must be routed by the reverse proxy, see README";
    }

    # статика: кеш на рік (міняєте файл — міняйте ім'я або додавайте ?v=2)
    location ^~ /assets/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        access_log off;
    }

    location = /robots.txt  { include /etc/nginx/snippets/headers.conf; add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { include /etc/nginx/snippets/headers.conf; add_header Cache-Control "public, max-age=3600"; }
    location = /favicon.ico { include /etc/nginx/snippets/headers.conf; add_header Cache-Control "public, max-age=604800"; access_log off; log_not_found off; }

    # HTML без кешу: зміни видно одразу
    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        # красиві URL: /privacy/ → /privacy/index.html; /privacy → 301 /privacy/
        try_files $uri $uri/ =404;
    }

    # будь-яка неіснуюча сторінка → головна
    error_page 404 = @home;
    location @home { return 302 /; }
}
